name: 지표 수집

on:
  schedule:
    # 시각은 전부 UTC 기준. 한국시간 = UTC + 9시간
    #
    # 00:00~07:30 UTC = 한국시간 09:00~16:30  → 근무 중 쉬는시간·점심시간
    - cron: "*/30 0-7 * * 1-5"
    # 13:00~21:30 UTC = 한국시간 22:00~06:30  → 미국 장중
    - cron: "*/30 13-21 * * 1-5"
    # 한국 장 마감 직후 한 번 더
    - cron: "40 6 * * 1-5"
  workflow_dispatch:   # 깃허브 화면에서 손으로 즉시 실행

# 실행이 겹치면 이전 것을 취소한다
concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 지표 받아오기
        run: python fetch.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "지표 갱신 $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
